<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>너를 알아볼 수 있게 — EONNAM HIGH SCHOOL SPECIAL ALBUM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#0a1224;
    --gold:#d8b374;
    --gold-soft:#e8cd9a;
    --coral:#e88a63;
    --peach:#f0b28e;
    --cream:#f4ecd8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background: radial-gradient(ellipse 1200px 800px at 50% 20%, #1c2c52, var(--navy-deep) 75%);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
    overflow-x:hidden;
  }

  .jacket-wrap{
    position:relative;
    width:100vw;
    aspect-ratio:1/1;
  }
  .jacket-img{
    width:100%;
    height:100%;
    display:block;
  }

  /* Now-playing equalizer bars, sitting just under the '게' in the main title */
  .title-eq{
    position:absolute;
    left:73%; top:31.5%;
    transform:translate(-50%,-50%);
    display:flex;
    align-items:flex-end;
    gap:.9vmin;
    height:4.2vmin;
    z-index:6;
    opacity:0;
    transition:opacity .25s ease;
    pointer-events:none;
  }
  .title-eq.active{ opacity:1; }
  .title-eq i{
    width:1vmin;
    background:var(--cream);
    border-radius:2px;
    animation: titlebar 0.9s ease-in-out infinite;
    box-shadow:0 0 8px rgba(244,236,216,.7);
  }
  .title-eq i:nth-child(1){ height:38%; animation-delay:0s; }
  .title-eq i:nth-child(2){ height:100%; animation-delay:.15s; }
  .title-eq i:nth-child(3){ height:58%; animation-delay:.3s; }
  .title-eq i:nth-child(4){ height:82%; animation-delay:.45s; }
  @keyframes titlebar{ 0%,100%{ transform:scaleY(.35);} 50%{ transform:scaleY(1);} }

  /* Wide invisible click zone over each printed track line (number + title) */
  .track-row{
    position:absolute;
    background:transparent;
    border:none;
    padding:0;
    margin:0;
    cursor:pointer;
    z-index:5;
    -webkit-tap-highlight-color:transparent;
  }

  /* Visible square play icon, sized to the printed text, riding inside the row */
  .track-icon{
    position:absolute;
    transform:translate(-50%,-50%);
    width:6vmin;
    height:6vmin;
    border-radius:1.2vmin;
    background:rgba(10,18,36,.65);
    border:.3vmin solid var(--gold-soft);
    color:var(--cream);
    display:flex; align-items:center; justify-content:center;
    pointer-events:none;
    transition: background .2s, transform .15s;
    box-shadow:0 4px 12px rgba(0,0,0,.4);
  }
  .track-row:hover .track-icon{ background:rgba(232,138,99,.55); }
  .track-row.active .track-icon{ background:rgba(232,138,99,.82); border-color:var(--coral); }
  .track-row:active .track-icon{ transform:translate(-50%,-50%) scale(.9); }
  .track-icon svg{ width:50%; height:50%; }

  /* Now Playing + transport controls, combined into one widget, bottom-right, enlarged */
  .now-playing-widget{
    position:absolute;
    right:3%; bottom:3.2%;
    width:54%;
    background:rgba(10,18,36,.76);
    backdrop-filter:blur(5px);
    border:1px solid rgba(216,179,116,.4);
    border-radius:1.8vmin;
    padding:2.6% 3.4%;
    z-index:7;
  }
  .np-row{
    display:flex;
    align-items:baseline;
    gap:1.6%;
    margin-bottom:2.2%;
    white-space:nowrap;
  }
  .np-label{
    font-family:'Space Mono', monospace;
    font-size:1.5vmin;
    letter-spacing:.14em;
    color:var(--peach);
    flex-shrink:0;
  }
  .np-name{
    font-family:'Noto Sans KR', sans-serif;
    font-weight:500;
    font-size:2.3vmin;
    color:var(--cream);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .transport-row{
    display:flex;
    align-items:center;
    gap:2.6%;
  }
  .tbtn-mini{
    width:13.5%;
    aspect-ratio:1/1;
    border-radius:50%;
    border:.24vmin solid rgba(216,179,116,.6);
    background:transparent;
    color:var(--cream);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition: background .2s, transform .15s;
  }
  .tbtn-mini:hover{ background:rgba(216,179,116,.2); }
  .tbtn-mini:active{ transform:scale(.9); }
  .tbtn-mini svg{ width:48%; height:48%; }
  .play-mini{
    width:16%;
    background:linear-gradient(160deg, var(--peach), var(--coral));
    border:none;
    color:var(--navy-deep);
  }
  .play-mini:hover{
    background:linear-gradient(160deg, var(--peach), var(--coral));
    filter:brightness(1.12);
  }
  .progress-wrap{ flex:1; min-width:0; }
  .progress-track{
    width:100%;
    height:.9vmin;
    background:rgba(244,236,216,.25);
    border-radius:5px;
    position:relative;
    cursor:pointer;
  }
  .progress-fill-mini{
    position:absolute; left:0; top:0; height:100%;
    width:0%;
    background:linear-gradient(90deg, var(--gold), var(--coral));
    border-radius:5px;
  }
  .time-row-mini{
    display:flex; justify-content:space-between;
    margin-top:1.1vmin;
    font-family:'Space Mono', monospace;
    font-size:1.35vmin;
    color:rgba(244,236,216,.65);
  }

  @media (max-width: 480px){
    .now-playing-widget{ width:60%; }
  }
</style>
</head>
<body>

<div class="jacket-wrap">
  <img class="jacket-img" src="jacket.png" alt="너를 알아볼 수 있게 앨범 재킷">

  <div class="title-eq" id="titleEq">
    <i></i><i></i><i></i><i></i>
  </div>

  <!-- Row 1 : whole title area is clickable, square icon sits precisely after the last character -->
  <button class="track-row" data-src="track01.mp3" data-name="01. 너를 알아볼 수 있게" style="left:2%; top:60.5%; width:34%; height:6.5%;" aria-label="01. 너를 알아볼 수 있게 재생">
    <span class="track-icon" style="left:90.0%; top:52.3%;">
      <svg class="ic-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg class="ic-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
    </span>
  </button>

  <!-- Row 2 -->
  <button class="track-row" data-src="track02.mp3" data-name="02. 3악 캠페인송" style="left:2%; top:71.0%; width:34%; height:6.0%;" aria-label="02. 3악 캠페인송 재생">
    <span class="track-icon" style="left:73.8%; top:55.0%;">
      <svg class="ic-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg class="ic-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
    </span>
  </button>

  <!-- Row 3 -->
  <button class="track-row" data-src="track03.mp3" data-name="03. 3착 캠페인송" style="left:2%; top:80.0%; width:34%; height:6.0%;" aria-label="03. 3착 캠페인송 재생">
    <span class="track-icon" style="left:76.5%; top:51.7%;">
      <svg class="ic-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg class="ic-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
    </span>
  </button>

  <!-- Row 4 -->
  <button class="track-row" data-src="track04.mp3" data-name="04. 졸업 안했다아이가" style="left:2%; top:88.7%; width:34%; height:7.0%;" aria-label="04. 졸업 안했다아이가 재생">
    <span class="track-icon" style="left:92.6%; top:44.3%;">
      <svg class="ic-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg class="ic-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
    </span>
  </button>

  <div class="now-playing-widget">
    <div class="np-row">
      <span class="np-label">NOW PLAYING</span>
      <span class="np-name" id="npName">트랙을 선택하세요</span>
    </div>
    <div class="transport-row">
      <button class="tbtn-mini" id="prevBtn" aria-label="이전 곡">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 10.5 6V6z"/></svg>
      </button>
      <button class="tbtn-mini play-mini" id="miniPlay" aria-label="재생/일시정지">
        <svg class="ic-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg class="ic-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
      </button>
      <button class="tbtn-mini" id="nextBtn" aria-label="다음 곡">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 18h2V6h-2zM14.5 12 4 6v12z"/></svg>
      </button>
      <div class="progress-wrap">
        <div class="progress-track" id="progressBar">
          <div class="progress-fill-mini" id="progressFill"></div>
        </div>
        <div class="time-row-mini">
          <span id="curTime">0:00</span>
          <span id="durTime">0:00</span>
        </div>
      </div>
    </div>
  </div>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
  const trackRows = Array.from(document.querySelectorAll('.track-row'));
  const miniPlay = document.getElementById('miniPlay');
  const titleEq = document.getElementById('titleEq');
  const npName = document.getElementById('npName');
  const audio = document.getElementById('audio');
  const progressBar = document.getElementById('progressBar');
  const progressFill = document.getElementById('progressFill');
  const curTimeEl = document.getElementById('curTime');
  const durTimeEl = document.getElementById('durTime');

  let currentIndex = -1;

  function fmtTime(sec){
    if(!isFinite(sec) || sec < 0) return '0:00';
    const m = Math.floor(sec/60);
    const s = Math.floor(sec%60).toString().padStart(2,'0');
    return `${m}:${s}`;
  }

  function setIcon(el, playing){
    el.querySelector('.ic-play').style.display = playing ? 'none' : '';
    el.querySelector('.ic-pause').style.display = playing ? '' : 'none';
  }

  function refreshIcons(){
    const playing = currentIndex !== -1 && !audio.paused;
    trackRows.forEach((b,i)=>{
      const isActive = i === currentIndex;
      b.classList.toggle('active', isActive);
      setIcon(b, isActive && playing);
    });
    setIcon(miniPlay, playing);
    titleEq.classList.toggle('active', playing);
  }

  // Safe play helper: always resolves the icon state, even if the browser
  // rejects/interrupts a play() call (e.g. rapid repeated clicks).
  function safePlay(){
    const p = audio.play();
    if(p !== undefined){
      p.then(refreshIcons).catch(refreshIcons);
    }
  }

  function loadTrack(index, autoplay){
    currentIndex = index;
    audio.src = trackRows[index].dataset.src;
    npName.textContent = trackRows[index].dataset.name;
    progressFill.style.width = '0%';
    curTimeEl.textContent = '0:00';
    durTimeEl.textContent = '0:00';
    if(autoplay){ safePlay(); }
    refreshIcons();
  }

  function playPause(){
    if(currentIndex === -1){
      loadTrack(0, true);
      return;
    }
    if(audio.paused){ safePlay(); }
    else { audio.pause(); refreshIcons(); }
  }

  trackRows.forEach((btn, i)=>{
    btn.addEventListener('click', (e)=>{
      e.preventDefault();
      if(i === currentIndex){ playPause(); }
      else { loadTrack(i, true); }
    });
  });

  miniPlay.addEventListener('click', (e)=>{ e.preventDefault(); playPause(); });

  document.getElementById('prevBtn').addEventListener('click', (e)=>{
    e.preventDefault();
    const i = currentIndex <= 0 ? trackRows.length-1 : currentIndex-1;
    loadTrack(i, true);
  });
  document.getElementById('nextBtn').addEventListener('click', (e)=>{
    e.preventDefault();
    const i = currentIndex >= trackRows.length-1 ? 0 : currentIndex+1;
    loadTrack(i, true);
  });

  audio.addEventListener('play', refreshIcons);
  audio.addEventListener('pause', refreshIcons);
  audio.addEventListener('error', refreshIcons);
  audio.addEventListener('stalled', refreshIcons);
  audio.addEventListener('timeupdate', ()=>{
    const pct = audio.duration ? (audio.currentTime/audio.duration)*100 : 0;
    progressFill.style.width = pct + '%';
    curTimeEl.textContent = fmtTime(audio.currentTime);
  });
  audio.addEventListener('loadedmetadata', ()=>{
    durTimeEl.textContent = fmtTime(audio.duration);
  });
  audio.addEventListener('ended', ()=>{
    const i = currentIndex >= trackRows.length-1 ? 0 : currentIndex+1;
    loadTrack(i, i !== 0 || trackRows.length === 1);
  });

  progressBar.addEventListener('click', (e)=>{
    if(!audio.duration) return;
    const rect = progressBar.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    audio.currentTime = pct * audio.duration;
  });
</script>

</body>
</html>
