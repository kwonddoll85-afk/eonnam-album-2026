<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>너를 알아볼 수 있게 — EONNAM HIGH SCHOOL SPECIAL ALBUM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#0a1224;
    --gold:#d8b374;
    --gold-soft:#e8cd9a;
    --coral:#e88a63;
    --peach:#f0b28e;
    --cream:#f4ecd8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background: radial-gradient(ellipse 1200px 800px at 50% 20%, #1c2c52, var(--navy-deep) 75%);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    overflow-x:hidden;
  }

  .jacket-wrap{
    position:relative;
    width:min(94vw, 94vh);
    aspect-ratio:1/1;
  }
  .jacket-img{
    width:100%;
    height:100%;
    display:block;
    border-radius:6px;
    box-shadow:0 40px 100px rgba(0,0,0,.65);
  }
  .stereo-tag{
    position:absolute;
    top:-2%; left:-2.5%;
    background:var(--cream);
    color:var(--navy-deep);
    font-family:'Courier New', monospace;
    font-weight:700;
    font-size:1.3vmin;
    letter-spacing:.1em;
    padding:.5vmin 1vmin;
    border-radius:3px;
    transform:rotate(-6deg);
    box-shadow:0 6px 14px rgba(0,0,0,.4);
    z-index:5;
    white-space:nowrap;
  }

  /* Big hero play button next to the main title */
  .hero-play{
    position:absolute;
    top:35%; left:88%;
    transform:translate(-50%,-50%);
    width:16%;
    aspect-ratio:1/1;
    border-radius:50%;
    background:rgba(10,18,36,.6);
    backdrop-filter:blur(3px);
    border:.4vmin solid var(--gold);
    color:var(--cream);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    box-shadow:0 10px 26px rgba(0,0,0,.5);
    transition: background .2s, transform .15s;
    z-index:6;
  }
  .hero-play:hover{ background:rgba(232,138,99,.55); }
  .hero-play:active{ transform:translate(-50%,-50%) scale(.93); }
  .hero-play svg{ width:44%; height:44%; }
  .hero-play.playing{ animation: pulse-ring 1.7s ease-out infinite; }
  @keyframes pulse-ring{
    0%{ box-shadow:0 0 0 0 rgba(216,179,116,.6), 0 10px 26px rgba(0,0,0,.5); }
    100%{ box-shadow:0 0 0 22px rgba(216,179,116,0), 0 10px 26px rgba(0,0,0,.5); }
  }

  /* Track buttons placed precisely beside the last character of each printed title */
  .track-btn{
    position:absolute;
    transform:translate(-50%,-50%);
    width:7.6%;
    aspect-ratio:1/1;
    border-radius:50%;
    background:rgba(10,18,36,.62);
    border:.26vmin solid var(--gold-soft);
    color:var(--cream);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    box-shadow:0 6px 16px rgba(0,0,0,.45);
    transition: background .2s, transform .15s;
    z-index:6;
  }
  .track-btn:hover{ background:rgba(232,138,99,.55); }
  .track-btn.active{ background:rgba(232,138,99,.8); border-color:var(--coral); }
  .track-btn svg{ width:42%; height:42%; }
  .track-btn:active{ transform:translate(-50%,-50%) scale(.9); }

  /* Now Playing + transport controls, combined into one widget, bottom-right */
  .now-playing-widget{
    position:absolute;
    right:3%; bottom:3.5%;
    width:44%;
    background:rgba(10,18,36,.74);
    backdrop-filter:blur(5px);
    border:1px solid rgba(216,179,116,.38);
    border-radius:1.4vmin;
    padding:2% 3%;
    z-index:7;
  }
  .np-row{
    display:flex;
    align-items:baseline;
    gap:1.4%;
    margin-bottom:1.6%;
    white-space:nowrap;
  }
  .np-label{
    font-family:'Space Mono', monospace;
    font-size:1.15vmin;
    letter-spacing:.14em;
    color:var(--peach);
    flex-shrink:0;
  }
  .np-name{
    font-family:'Noto Sans KR', sans-serif;
    font-size:1.7vmin;
    color:var(--cream);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .transport-row{
    display:flex;
    align-items:center;
    gap:2.2%;
  }
  .tbtn-mini{
    width:9%;
    aspect-ratio:1/1;
    border-radius:50%;
    border:.18vmin solid rgba(216,179,116,.55);
    background:transparent;
    color:var(--cream);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition: background .2s, transform .15s;
  }
  .tbtn-mini:hover{ background:rgba(216,179,116,.18); }
  .tbtn-mini:active{ transform:scale(.9); }
  .tbtn-mini svg{ width:48%; height:48%; }
  .play-mini{
    width:13%;
    background:linear-gradient(160deg, var(--peach), var(--coral));
    border:none;
    color:var(--navy-deep);
  }
  .progress-wrap{ flex:1; min-width:0; }
  .progress-track{
    width:100%;
    height:.65vmin;
    background:rgba(244,236,216,.25);
    border-radius:4px;
    position:relative;
    cursor:pointer;
  }
  .progress-fill-mini{
    position:absolute; left:0; top:0; height:100%;
    width:0%;
    background:linear-gradient(90deg, var(--gold), var(--coral));
    border-radius:4px;
  }
  .time-row-mini{
    display:flex; justify-content:space-between;
    margin-top:.9vmin;
    font-family:'Space Mono', monospace;
    font-size:1vmin;
    color:rgba(244,236,216,.6);
  }

  @media (max-width: 480px){
    .now-playing-widget{ width:48%; padding:1.8% 2.6%; }
    .np-label{ font-size:1.35vmin; }
    .np-name{ font-size:2vmin; }
    .time-row-mini{ font-size:1.2vmin; }
  }
</style>
</head>
<body>

<div class="jacket-wrap">
  <img class="jacket-img" src="jacket.png" alt="너를 알아볼 수 있게 앨범 재킷">
  <div class="stereo-tag">STEREO · 2026</div>

  <button class="hero-play" id="heroPlay" aria-label="재생/일시정지">
    <svg class="ic-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    <svg class="ic-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
  </button>

  <button class="track-btn" data-src="track01.mp3" data-name="01. 너를 알아볼 수 있게" style="left:32.6%; top:63.9%;" aria-label="01. 너를 알아볼 수 있게 재생">
    <svg class="ic-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    <svg class="ic-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
  </button>
  <button class="track-btn" data-src="track02.mp3" data-name="02. 3악 캠페인송" style="left:27.1%; top:74.3%;" aria-label="02. 3악 캠페인송 재생">
    <svg class="ic-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    <svg class="ic-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
  </button>
  <button class="track-btn" data-src="track03.mp3" data-name="03. 3착 캠페인송" style="left:28.0%; top:83.1%;" aria-label="03. 3착 캠페인송 재생">
    <svg class="ic-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    <svg class="ic-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
  </button>
  <button class="track-btn" data-src="track04.mp3" data-name="04. 졸업 안했다아이가" style="left:33.5%; top:91.8%;" aria-label="04. 졸업 안했다아이가 재생">
    <svg class="ic-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    <svg class="ic-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
  </button>

  <div class="now-playing-widget">
    <div class="np-row">
      <span class="np-label">NOW PLAYING</span>
      <span class="np-name" id="npName">트랙을 선택하세요</span>
    </div>
    <div class="transport-row">
      <button class="tbtn-mini" id="prevBtn" aria-label="이전 곡">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 10.5 6V6z"/></svg>
      </button>
      <button class="tbtn-mini play-mini" id="miniPlay" aria-label="재생/일시정지">
        <svg class="ic-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg class="ic-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
      </button>
      <button class="tbtn-mini" id="nextBtn" aria-label="다음 곡">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 18h2V6h-2zM14.5 12 4 6v12z"/></svg>
      </button>
      <div class="progress-wrap">
        <div class="progress-track" id="progressBar">
          <div class="progress-fill-mini" id="progressFill"></div>
        </div>
        <div class="time-row-mini">
          <span id="curTime">0:00</span>
          <span id="durTime">0:00</span>
        </div>
      </div>
    </div>
  </div>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
  const trackBtns = Array.from(document.querySelectorAll('.track-btn'));
  const heroPlay = document.getElementById('heroPlay');
  const miniPlay = document.getElementById('miniPlay');
  const npName = document.getElementById('npName');
  const audio = document.getElementById('audio');
  const progressBar = document.getElementById('progressBar');
  const progressFill = document.getElementById('progressFill');
  const curTimeEl = document.getElementById('curTime');
  const durTimeEl = document.getElementById('durTime');

  let currentIndex = -1;

  function fmtTime(sec){
    if(!isFinite(sec) || sec < 0) return '0:00';
    const m = Math.floor(sec/60);
    const s = Math.floor(sec%60).toString().padStart(2,'0');
    return `${m}:${s}`;
  }

  function setIcon(btn, playing){
    btn.querySelector('.ic-play').style.display = playing ? 'none' : '';
    btn.querySelector('.ic-pause').style.display = playing ? '' : 'none';
  }

  function refreshIcons(){
    const playing = currentIndex !== -1 && !audio.paused;
    trackBtns.forEach((b,i)=>{
      const isActive = i === currentIndex;
      b.classList.toggle('active', isActive);
      setIcon(b, isActive && playing);
    });
    setIcon(heroPlay, playing);
    setIcon(miniPlay, playing);
    heroPlay.classList.toggle('playing', playing);
  }

  function loadTrack(index, autoplay){
    currentIndex = index;
    audio.src = trackBtns[index].dataset.src;
    npName.textContent = trackBtns[index].dataset.name;
    if(autoplay){ audio.play().catch(()=>{}); }
    refreshIcons();
  }

  function playPause(){
    if(currentIndex === -1){
      loadTrack(0, true);
      return;
    }
    if(audio.paused){ audio.play().catch(()=>{}); }
    else { audio.pause(); }
  }

  trackBtns.forEach((btn, i)=>{
    btn.addEventListener('click', ()=>{
      if(i === currentIndex){ playPause(); }
      else { loadTrack(i, true); }
    });
  });

  heroPlay.addEventListener('click', playPause);
  miniPlay.addEventListener('click', playPause);

  document.getElementById('prevBtn').addEventListener('click', ()=>{
    const i = currentIndex <= 0 ? trackBtns.length-1 : currentIndex-1;
    loadTrack(i, true);
  });
  document.getElementById('nextBtn').addEventListener('click', ()=>{
    const i = currentIndex >= trackBtns.length-1 ? 0 : currentIndex+1;
    loadTrack(i, true);
  });

  audio.addEventListener('play', refreshIcons);
  audio.addEventListener('pause', refreshIcons);
  audio.addEventListener('timeupdate', ()=>{
    const pct = audio.duration ? (audio.currentTime/audio.duration)*100 : 0;
    progressFill.style.width = pct + '%';
    curTimeEl.textContent = fmtTime(audio.currentTime);
  });
  audio.addEventListener('loadedmetadata', ()=>{
    durTimeEl.textContent = fmtTime(audio.duration);
  });
  audio.addEventListener('ended', ()=>{
    const i = currentIndex >= trackBtns.length-1 ? 0 : currentIndex+1;
    if(i === 0){ loadTrack(0, false); }
    else { loadTrack(i, true); }
  });

  progressBar.addEventListener('click', (e)=>{
    if(!audio.duration) return;
    const rect = progressBar.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    audio.currentTime = pct * audio.duration;
  });
</script>

</body>
</html>
